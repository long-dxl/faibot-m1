  - {ma: M1-BS-031, ten: Nan nhôm 20×40, sl: 3, hinh: M1-BS-031_spoke0}
  oc:
  - {id: F06, sl: 3}
  - {id: F07}
  mo_ta: Đặt tấm thép nằm phẳng, lưỡi hướng ra trước. Bắt ba nan theo góc 0°, 120°, 240°.
