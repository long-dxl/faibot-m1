# Trình tự lắp để vẽ hình nổ cho M1_assembly_A5_v0.5.pdf (render_pdf_buoc.py đọc file này).
# Mỗi bước: cum, ten, nhom (biểu thức tên chi tiết trong manifest.json của assembly_pl.py -> độ lệch nổ, mm, hệ W: x trước, y trái, z lên),
# chi_tiet (thẻ chi tiết: ma, ten, sl, hinh = biểu thức tên mesh dùng vẽ thẻ), oc (id trong media/hardware/bang-oc.csv, sl, ghi), mo_ta.
# Nhóm có "radial": lệch ra ngoài theo hướng từ trục robot tới chi tiết, độ dài = radial (mm).
# Chi tiết không khớp nhóm nào thì không vẽ; render_pdf_buoc.py in danh sách đó.
# Nhóm có "cua_buoc": gom mọi chi tiết đã lắp ở các bước đó (đặt trạm lên đế ngàm). "canh_bao": hộp cảnh báo trên trang bước. "anh": thẻ dùng ảnh trong media/hardware/thumbs.
cum: {de: Đế di động, truc: Trục nâng, tram: Trạm hai tay, dien: Điện}
goc_mac_dinh: [20, -50]
buoc:
- id: de-1
  cum: de
  ten: Tấm thép đối trọng và ba nan nhôm
  goc: [28, -50]
  nhom:
