[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faibot-m1"
version = "0.5.0"
description = "Python SDK and command-line tool for the Faibot M1 two-arm mobile robot (MuJoCo simulation and Feetech STS servo bus)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mujoco>=4.0",
    "numpy>=2.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
hw = ["gpiod>=2"]
cameras = ["opencv-python>=4.8"]

[project.scripts]
faibot-m1 = "faibotic.cli:main"

[tool.setuptools.packages.find]
include = ["faibotic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
